<style>
  :root{
    --ink:#0e0d0c;
    --paper:#faf8f3;
    --card:#ffffff;
    --line:#e6dfcb;
    --line-strong:#cdc0a0;
    --gold:#a9863f;
    --gold-soft:#f3ead2;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f3efe6; --paper:#111010; --card:#1a1917; --line:#332f27; --line-strong:#463f30;
      --gold-soft:#332918;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f3efe6; --paper:#111010; --card:#1a1917; --line:#332f27; --line-strong:#463f30;
    --gold-soft:#332918;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%; background:var(--paper); color:var(--ink);
    font-family:'Jost', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Bodoni Moda', Didot, Georgia, serif;}

  /* ---- login screen ---- */
  .login-screen{
    position:fixed; inset:0; background:var(--ink); color:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; z-index:50; text-align:center;
  }
  .login-logo{width:64px; height:64px; border-radius:50%; margin-bottom:18px;}
  .login-word{
    font-family:'Bodoni Moda', serif; font-weight:600; font-size:1.5rem;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .login-sub{
    font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; opacity:.55;
    margin-top:8px; margin-bottom:34px;
  }
  .login-form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:14px;}
  .login-form label{
    font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; opacity:.6; text-align:left;
  }
  .login-form input{
    font-family:'Jost', sans-serif; font-size:.95rem; padding:12px 4px;
    border:none; border-bottom:1px solid rgba(250,248,243,.3);
    background:transparent; color:var(--paper); width:100%;
  }
  .login-form input:focus{outline:none; border-bottom-color:var(--gold);}
  .login-form button{
    margin-top:8px; padding:13px; border:1px solid var(--gold); border-radius:1px;
    background:var(--gold); color:var(--ink); font-family:'Jost', sans-serif;
    font-size:.76rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    cursor:pointer;
  }

  .whoami{
    text-align:center; font-size:.68rem; opacity:.6; margin-top:-6px; margin-bottom:18px;
    font-family:'Jost', sans-serif;
  }
  .whoami strong{font-weight:600; opacity:1;}
  .whoami button{
    background:none; border:none; color:var(--gold); font-family:'Jost', sans-serif;
    font-size:.68rem; text-decoration:underline; cursor:pointer; padding:0;
  }

  .wrap{max-width:620px; margin:0 auto; padding:0 18px 70px;}

  header{
    display:flex; align-items:center; gap:16px;
    padding:30px 0 24px;
  }
  header img{width:50px; height:50px; border-radius:50%; flex-shrink:0; border:1px solid var(--line-strong);}
  header .word{
    font-family:'Bodoni Moda', Didot, Georgia, serif; font-weight:600;
    font-size:1.5rem; letter-spacing:.06em; line-height:1; text-transform:uppercase;
  }
  header .sub{
    font-size:.66rem; letter-spacing:.18em; text-transform:uppercase;
    opacity:.5; margin-top:8px;
  }

  /* ---- days-without-occurrence plaque ---- */
  .dayscounter{
    background:var(--ink); color:var(--paper); text-align:center;
    padding:22px 10px 20px; margin-top:2px; border-radius:1px;
    border:1px solid var(--ink);
  }
  .dc-num{
    font-family:'Bodoni Moda', serif; font-weight:600; font-size:3rem; line-height:1;
    color:var(--gold);
  }
  .dc-label{
    font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; opacity:.75;
    margin-top:8px;
  }

  /* ---- summary strip ---- */
  .summary{
    display:grid; grid-template-columns:repeat(4,1fr); gap:0;
    border:1px solid var(--line-strong); border-radius:1px; overflow:hidden;
    margin-top:2px;
  }
  .summary .cell{
    text-align:center; padding:14px 4px 12px; border-right:1px solid var(--line);
    background:var(--card);
  }
  .summary .cell:last-child{border-right:none;}
  .summary .num{font-family:'Bodoni Moda', serif; font-weight:600; font-size:1.5rem; line-height:1;}
  .summary .lbl{
    font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; opacity:.45; margin-top:6px;
  }

  /* ---- ticket / form panel ---- */
  .ticket{
    position:relative;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:1px;
    margin-top:14px;
    padding:28px 26px 24px;
  }
  .ticket::before, .ticket::after{
    content:''; position:absolute; top:50%; width:20px; height:20px;
    background:var(--paper); border:1px solid var(--line-strong); border-radius:50%;
    transform:translateY(-50%);
  }
  .ticket::before{ left:-11px; }
  .ticket::after{ right:-11px; }
  .ticket-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--ink); padding-bottom:14px; margin-bottom:20px;
  }
  .ticket-head h2{
    font-family:'Bodoni Moda', Georgia, serif; font-weight:600; font-size:1.25rem; margin:0;
  }
  .ticket-head span{font-size:.62rem; opacity:.45; letter-spacing:.14em; text-transform:uppercase;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field.full{grid-column:1 / -1;}
  label{
    font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; opacity:.5;
  }
  input, textarea{
    font-family:'Jost', sans-serif; font-size:.92rem;
    padding:9px 2px; border:none; border-bottom:1px solid var(--line-strong);
    background:transparent; color:var(--ink); width:100%; border-radius:0;
  }
  input:focus, textarea:focus{outline:none; border-bottom-color:var(--gold);}
  textarea{resize:vertical; min-height:60px; border:1px solid var(--line-strong); border-radius:1px; padding:10px;}

  button.primary{
    width:100%; margin-top:8px; padding:14px; border:1px solid var(--ink); border-radius:1px;
    background:var(--ink); color:var(--paper); font-family:'Jost', sans-serif;
    font-size:.76rem; letter-spacing:.16em; text-transform:uppercase; font-weight:500;
    cursor:pointer; transition:opacity .1s ease;
  }
  button.primary:active{opacity:.8;}
  button.primary:disabled{opacity:.4; cursor:default;}
  .status-msg{font-size:.72rem; opacity:.5; text-align:center; margin-top:10px; min-height:1em;}

  /* ---- filter tabs ---- */
  .tabs{display:flex; gap:0; margin-top:32px; border:1px solid var(--line-strong); border-radius:1px; overflow:hidden;}
  .tab{
    flex:1; text-align:center; padding:11px 6px; font-size:.66rem; letter-spacing:.1em;
    text-transform:uppercase; cursor:pointer; background:var(--card); border-right:1px solid var(--line-strong);
  }
  .tab:last-child{border-right:none;}
  .tab.active{background:var(--ink); color:var(--paper);}

  .list{margin-top:18px; display:flex; flex-direction:column; gap:12px;}
  .empty{
    text-align:center; opacity:.45; padding:50px 10px; font-size:.85rem;
    font-family:'Bodoni Moda', serif; font-style:italic;
  }

  .item{
    position:relative;
    background:var(--card); border:1px solid var(--line-strong); border-radius:1px;
    padding:17px 19px 15px;
  }
  .item::before{
    content:''; position:absolute; left:0; top:14px; bottom:14px; width:2px;
  }
  .item.finalizada::before{ background:var(--ink); }
  .item.em_analise::before{ background:var(--gold); }
  .item.aberto::before{ background:var(--line-strong); }

  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .item-top strong{font-family:'Bodoni Moda', serif; font-weight:600; font-size:1.05rem;}
  .item-sub{font-size:.72rem; opacity:.5; margin-top:3px; letter-spacing:.02em;}

  .stamp{
    font-family:'Jost', sans-serif; font-size:.62rem; letter-spacing:.12em;
    text-transform:uppercase; padding:6px 12px; border-radius:1px; white-space:nowrap;
    cursor:pointer; font-weight:500;
  }
  .stamp.aberto{ border:1px solid var(--line-strong); color:var(--ink); opacity:.55; background:transparent; }
  .stamp.analise{ border:1px solid var(--gold); color:var(--gold); background:var(--gold-soft); }
  .stamp.finalizada{ border:1px solid var(--ink); color:var(--paper); background:var(--ink); }

  .meta{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:13px; font-size:.76rem;}
  .meta span{opacity:.45;}
  .desc{
    margin-top:11px; font-size:.87rem; line-height:1.55; font-family:'Jost', sans-serif; font-weight:400;
    border-top:1px solid var(--line); padding-top:11px;
  }
  input[type="file"]{
    font-family:'Jost', sans-serif; font-size:.82rem; border:1px dashed var(--line-strong);
    padding:12px 10px; cursor:pointer;
  }
  .foto-preview{
    display:block; width:100%; max-height:200px; object-fit:cover; margin-top:10px;
    border:1px solid var(--line-strong); border-radius:1px;
  }
  .item-foto{
    display:block; width:100%; max-height:220px; object-fit:cover; margin-top:12px;
    border:1px solid var(--line-strong); border-radius:1px; cursor:pointer;
  }
  .item-foto.full{position:fixed; inset:0; width:100%; height:100%; max-height:none; object-fit:contain; background:#000; z-index:60; margin:0; border:none;}
  .upload-msg{font-size:.68rem; opacity:.5; margin-top:6px;}

  .report-toggle{
    width:100%; margin-top:16px; padding:11px; background:transparent;
    border:1px solid var(--line-strong); border-radius:1px; cursor:pointer;
    font-family:'Jost', sans-serif; font-size:.7rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink); opacity:.7;
  }
  .report-panel{
    background:var(--card); border:1px solid var(--line-strong); border-radius:1px;
    margin-top:12px; padding:22px 22px 18px;
  }
  .report-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px solid var(--ink); padding-bottom:12px; margin-bottom:16px;
  }
  .report-head h2{font-family:'Bodoni Moda', serif; font-weight:600; font-size:1.1rem; margin:0;}
  .report-head span{font-size:.66rem; opacity:.45; letter-spacing:.04em;}
  .report-section{margin-bottom:18px;}
  .report-section:last-child{margin-bottom:0;}
  .report-section h3{
    font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; opacity:.5;
    margin:0 0 10px;
  }
  .report-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 0; border-bottom:1px solid var(--line); font-size:.86rem;
  }
  .report-row:last-child{border-bottom:none;}
  .report-row .rname{font-family:'Jost', sans-serif;}
  .report-row .rcount{font-family:'Bodoni Moda', serif; font-weight:600;}
  .report-empty{font-size:.8rem; opacity:.45; font-style:italic; font-family:'Bodoni Moda', serif;}

  .cancel-edit{
    width:100%; margin-top:8px; padding:10px; background:transparent;
    border:1px solid var(--line-strong); border-radius:1px; cursor:pointer;
    font-family:'Jost', sans-serif; font-size:.72rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink); opacity:.6;
  }

  .searchbar{margin-top:16px;}
  .searchbar input{
    width:100%; font-family:'Jost', sans-serif; font-size:.88rem;
    padding:11px 12px; border:1px solid var(--line-strong); border-radius:1px;
    background:var(--card); color:var(--ink);
  }
  .searchbar input:focus{outline:none; border-color:var(--gold);}

  .item-actions{display:flex; gap:16px; margin-top:12px;}
  .edit-btn{
    background:none; border:none; color:var(--ink); opacity:.55;
    font-family:'Jost', sans-serif; font-size:.68rem; letter-spacing:.06em;
    cursor:pointer; padding:0; text-decoration:underline; text-transform:uppercase;
  }
  .desc{ cursor:pointer; }
  .desc.clamped{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .desc-more{font-size:.68rem; opacity:.5; margin-top:4px; text-decoration:underline;}

  .del{
    margin-top:0; background:none; border:none; color:var(--ink); opacity:.4;
    font-family:'Jost', sans-serif; font-size:.68rem; letter-spacing:.06em;
    cursor:pointer; padding:0; text-decoration:underline; text-transform:uppercase;
  }
  .del.confirm{ color:var(--wine, #8a2e2e); opacity:1; font-weight:600; }
</style>
</head>

// Reduz a foto e guarda dentro do próprio registro (evita precisar de Storage pago)
function resizeToDataUrl(file, maxSide = 900, quality = 0.7){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

  document.getElementById('appWrap').style.display = 'block';
  document.getElementById('whoamiName').textContent = currentUser || '';
}

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('loginName').value.trim();
  if(!name) return;
  currentUser = name;
  try{ localStorage.setItem(USER_KEY, name); }catch(err){}
  showApp();
});

document.getElementById('trocarUser').addEventListener('click', () => {
  currentUser = null;
  try{ localStorage.removeItem(USER_KEY); }catch(err){}
  document.getElementById('loginName').value = '';
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
});

if(currentUser){ showApp(); }

let db = null;
let col = null;
let assetsApi = null;
let pendingFotoFile = null;
let items = [];
let filter = 'todas';
let ready = false;
let submitting = false;

const listEl = document.getElementById('list');
const formEl = document.getElementById('form');
const submitBtn = document.getElementById('submitBtn');
const formMsg = document.getElementById('formMsg');

document.getElementById('data').valueAsDate = new Date();

const fotoInput = document.getElementById('foto');
const fotoPreview = document.getElementById('fotoPreview');
const fotoPreviewWrap = document.getElementById('fotoPreviewWrap');

fotoInput.addEventListener('change', () => {
  const file = fotoInput.files[0];
  pendingFotoFile = file || null;
  if(file){
    fotoPreview.src = URL.createObjectURL(file);
    fotoPreviewWrap.style.display = 'block';
  } else {
    fotoPreviewWrap.style.display = 'none';
  }
});

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d && m && y ? `${d}/${m}/${y}` : iso;
}

const STATUS_LABEL = {aberto:'Aberto', em_analise:'Em análise', finalizada:'Finalizada'};
const STATUS_NEXT = {aberto:'em_analise', em_analise:'finalizada', finalizada:'aberto'};
const STATUS_STAMP_CLASS = {aberto:'aberto', em_analise:'analise', finalizada:'finalizada'};

function updateDaysCounter(){
  const dcNum = document.getElementById('dcNum');
  const dcLabel = document.getElementById('dcLabel');
  const datas = items.map(it => it.data).filter(Boolean).sort();
  if(datas.length===0){
    dcNum.textContent = '—';
    dcLabel.textContent = 'nenhuma ocorrência registrada';
    return;
  }
  const last = datas[datas.length-1];
  const [y,m,d] = last.split('-').map(Number);
  const lastDate = new Date(y, m-1, d);
  const today = new Date();
  today.setHours(0,0,0,0);
  lastDate.setHours(0,0,0,0);
  const diff = Math.max(0, Math.round((today - lastDate) / 86400000));
  dcNum.textContent = diff;
  dcLabel.textContent = diff===1 ? 'dia sem ocorrência' : 'dias sem ocorrência';
}

function updateSummary(){
  document.getElementById('cntTotal').textContent = items.length;
  document.getElementById('cntAberto').textContent = items.filter(i=>i.status==='aberto').length;
  document.getElementById('cntAnalise').textContent = items.filter(i=>i.status==='em_analise').length;
  document.getElementById('cntFinalizada').textContent = items.filter(i=>i.status==='finalizada').length;
}

let searchTerm = '';
let editingId = null;
let editingFotoId = null;
let confirmDeleteId = null;
let confirmDeleteTimer = null;
const cancelEditBtn = document.getElementById('cancelEdit');
const ticketTitle = document.getElementById('ticketTitle');
const ticketSub = document.getElementById('ticketSub');

function enterEditMode(it){
  editingId = it.id;
  editingFotoId = it.foto_id || null;
  document.getElementById('cliente').value = it.cliente || '';
  document.getElementById('pedido').value = it.pedido || '';
  document.getElementById('data').value = it.data || '';
  document.getElementById('separador').value = it.separador || '';
  document.getElementById('conferente').value = it.conferente || '';
  document.getElementById('volumes').value = it.volumes || '';
  document.getElementById('descricao').value = it.descricao || '';
  pendingFotoFile = null;
  if(it.foto_id){
    fotoPreview.src = it.foto_id;
    fotoPreviewWrap.style.display = 'block';
  } else {
    fotoPreviewWrap.style.display = 'none';
  }
  ticketTitle.textContent = 'Editar ocorrência';
  ticketSub.textContent = 'pedido ' + (it.pedido || '');
  submitBtn.textContent = 'Salvar alterações';
  cancelEditBtn.style.display = 'block';
  formEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function exitEditMode(){
  editingId = null;
  editingFotoId = null;
  ticketTitle.textContent = 'Nova ocorrência';
  ticketSub.textContent = 'ficha de registro';
  submitBtn.textContent = 'Registrar ocorrência';
  cancelEditBtn.style.display = 'none';
  formEl.reset();
  document.getElementById('data').valueAsDate = new Date();
  pendingFotoFile = null;
  fotoPreviewWrap.style.display = 'none';
}

cancelEditBtn.addEventListener('click', exitEditMode);

function render(){
  updateSummary();
  updateDaysCounter();
  renderReport();
  let filtered = items.filter(it => filter==='todas' ? true : it.status===filter);
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    filtered = filtered.filter(it =>
      (it.cliente||'').toLowerCase().includes(q) ||
      (it.pedido||'').toLowerCase().includes(q)
    );
  }
  filtered.sort((a,b) => (b._ts||0) - (a._ts||0));

  if(!ready){
    listEl.innerHTML = '<div class="empty">carregando…</div>';
    return;
  }
  if(filtered.length===0){
    listEl.innerHTML = '<div class="empty">Nenhuma ocorrência aqui.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(it => `
    <div class="item ${it.status}">
      <div class="item-top">
        <div>
          <strong>${esc(it.cliente)}</strong>
          <div class="item-sub">Pedido ${esc(it.pedido)} · ${fmtDate(it.data)}${it.registrado_por ? ' · registrado por ' + esc(it.registrado_por) : ''}</div>
        </div>
        <button class="stamp ${STATUS_STAMP_CLASS[it.status]}" data-id="${it.id}">
          ${STATUS_LABEL[it.status]}
        </button>
      </div>
      <div class="meta">
        <div><span>Separador </span>${esc(it.separador)||'—'}</div>
        <div><span>Conferente </span>${esc(it.conferente)||'—'}</div>
        <div><span>Volumes </span>${esc(it.volumes)||'—'}</div>
      </div>
      <div class="desc clamped" data-toggle-desc>${esc(it.descricao)}</div>
      ${it.foto_id ? `<img class="item-foto" src="${esc(it.foto_id)}" alt="Foto do pedido" onclick="this.classList.toggle('full')">` : ''}
      <div class="item-actions">
        <button class="edit-btn" data-edit="${it.id}">Editar</button>
        <button class="del ${confirmDeleteId===it.id?'confirm':''}" data-del="${it.id}">${confirmDeleteId===it.id?'Confirmar exclusão?':'Excluir'}</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  render();
});

function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function topCounts(field, limit){
  const counts = {};
  const display = {};
  items.forEach(it => {
    const raw = (it[field] || '').trim();
    if(!raw) return;
    const key = raw.toLowerCase();
    counts[key] = (counts[key] || 0) + 1;
    if(!display[key]) display[key] = raw;
  });
  return Object.entries(counts)
    .sort((a,b) => b[1]-a[1])
    .slice(0, limit)
    .map(([key,count]) => [display[key], count]);
}

function reportRows(pairs, emptyMsg){
  if(pairs.length===0) return `<div class="report-empty">${emptyMsg}</div>`;
  return pairs.map(([name,count]) => `
    <div class="report-row">
      <span class="rname">${esc(name)}</span>
      <span class="rcount">${count}</span>
    </div>
  `).join('');
}

function renderReport(){
  const reportPeriod = document.getElementById('reportPeriod');
  const reportBody = document.getElementById('reportBody');
  if(!reportBody) return;

  if(items.length===0){
    reportPeriod.textContent = '';
    reportBody.innerHTML = '<div class="report-empty">Sem ocorrências registradas ainda.</div>';
    return;
  }

  const datas = items.map(it => it.data).filter(Boolean).sort();
  reportPeriod.textContent = datas.length
    ? `${fmtDate(datas[0])} — ${fmtDate(datas[datas.length-1])}`
    : '';

  const porStatus = [
    ['Aberto', items.filter(i=>i.status==='aberto').length],
    ['Em análise', items.filter(i=>i.status==='em_analise').length],
    ['Finalizada', items.filter(i=>i.status==='finalizada').length],
  ];

  reportBody.innerHTML = `
    <div class="report-section">
      <h3>Por status</h3>
      ${reportRows(porStatus.filter(p=>p[1]>0), 'Nenhuma ocorrência.')}
    </div>
    <div class="report-section">
      <h3>Clientes com mais ocorrências</h3>
      ${reportRows(topCounts('cliente', 5), 'Sem dados de cliente.')}
    </div>
    <div class="report-section">
      <h3>Por separador</h3>
      ${reportRows(topCounts('separador', 5), 'Sem separador informado.')}
    </div>
    <div class="report-section">
      <h3>Por conferente</h3>
      ${reportRows(topCounts('conferente', 5), 'Sem conferente informado.')}
    </div>
  `;
}

document.getElementById('reportToggle').addEventListener('click', () => {
  const panel = document.getElementById('reportPanel');
  const btn = document.getElementById('reportToggle');
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  btn.textContent = open ? 'Ver relatório ↓' : 'Ocultar relatório ↑';
});

listEl.addEventListener('click', async (e) => {
  const badge = e.target.closest('[data-id]');
  const del = e.target.closest('[data-del]');
  const editBtn = e.target.closest('[data-edit]');
  const descEl = e.target.closest('[data-toggle-desc]');
  if(descEl){
    descEl.classList.toggle('clamped');
    return;
  }
  if(editBtn){
    const it = items.find(x => x.id===editBtn.dataset.edit);
    if(it) enterEditMode(it);
    return;
  }
  if(badge && col){
    const id = badge.dataset.id;
    const it = items.find(x => x.id===id);
    if(!it) return;
    const next = STATUS_NEXT[it.status] || 'aberto';
    it.status = next;
    render();
    try{ await col.doc(id).update({status: next}); }catch(err){}
  }
  if(del && col){
    const id = del.dataset.del;
    if(confirmDeleteId !== id){
      confirmDeleteId = id;
      del.textContent = 'Confirmar exclusão?';
      del.classList.add('confirm');
      clearTimeout(confirmDeleteTimer);
      confirmDeleteTimer = setTimeout(() => {
        confirmDeleteId = null;
        render();
      }, 3000);
      return;
    }
    clearTimeout(confirmDeleteTimer);
    confirmDeleteId = null;
    items = items.filter(x => x.id!==id);
    render();
    try{ await col.doc(id).delete(); }catch(err){}
    if(editingId === id) exitEditMode();
  }
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    filter = tab.dataset.filter;
    render();
  });
});

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(submitting) return;
  submitting = true;
  submitBtn.disabled = true;
  formMsg.textContent = 'Salvando...';

  const doc = {
    cliente: document.getElementById('cliente').value.trim(),
    pedido: document.getElementById('pedido').value.trim(),
    data: document.getElementById('data').value,
    separador: document.getElementById('separador').value.trim(),
    conferente: document.getElementById('conferente').value.trim(),
    volumes: document.getElementById('volumes').value,
    descricao: document.getElementById('descricao').value.trim(),
  };
  if(!editingId){
    doc.status = 'aberto';
    doc._ts = Date.now();
    doc.registrado_por = currentUser || '';
  }

  let fotoFailed = false;
  if(pendingFotoFile && assetsApi){
    formMsg.textContent = 'Enviando foto...';
    try{
      const uploaded = await assetsApi.upload(pendingFotoFile);
      doc.foto_id = uploaded.id;
    }catch(err){
      fotoFailed = true;
      if(editingId && editingFotoId) doc.foto_id = editingFotoId;
    }
  } else if(editingId){
    doc.foto_id = editingFotoId || null;
  }

  if(col){
    try{
      if(editingId){
        await col.doc(editingId).update(doc);
      } else {
        await col.add(doc);
      }
      // items/render são atualizados pelo onSnapshot quando o servidor confirma;
      // não inserimos localmente aqui para não duplicar a entrada.
      const wasEditing = !!editingId;
      exitEditMode();
      formMsg.textContent = fotoFailed
        ? (wasEditing ? 'Alterações salvas (falha no envio da nova foto).' : 'Ocorrência registrada (falha no envio da foto).')
        : (wasEditing ? 'Alterações salvas.' : 'Ocorrência registrada.');
    }catch(err){
      formMsg.textContent = 'Não foi possível salvar. Tente novamente.';
    }
  } else {
    doc.id = editingId || ('local-' + Date.now());
    if(editingId){
      items = items.map(x => x.id===editingId ? {...x, ...doc} : x);
    } else {
      items.push(doc);
    }
    exitEditMode();
    render();
    formMsg.textContent = 'Salvo nesta sessão (armazenamento não disponível).';
  }
  submitBtn.disabled = false;
  submitting = false;
  setTimeout(() => formMsg.textContent = '', 3200);
});

async function init(){
  assetsApi = { upload: async (file) => ({ id: await resizeToDataUrl(file) }) };

  if(fsdb){
    const ref = collection(fsdb, 'ocorrencias');
    db = true;
    col = {
      add: (d) => addDoc(ref, d),
      doc: (id) => ({
        update: (d) => updateDoc(fdoc(fsdb, 'ocorrencias', id), d),
        delete: () => deleteDoc(fdoc(fsdb, 'ocorrencias', id))
      }),
      onSnapshot: (ok, fail) => onSnapshot(ref, ok, fail)
    };
    col.onSnapshot(
      (snap) => {
        items = snap.docs.map(d => ({id:d.id, ...d.data()}));
        ready = true;
        render();
      },
      (err) => { ready = true; render(); }
    );
  } else {
    ready = true;
    render();
    document.getElementById('formMsg').textContent = 'Configure o Firebase para salvar os dados.';
  }
}
init();
</script>
